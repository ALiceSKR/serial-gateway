[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-gateway"
version = "0.1.0"
description = "Multi-port AI shared serial gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pyserial==3.5",
  "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
